name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Etiketten sürümü uygula
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "invalid version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          python tools/bump_version.py "$v"

      - name: Testler
        run: |
          python -m py_compile stock_widget.py
          python -m unittest test_stock_widget.py

      - name: Portatif derleme
        run: python -m PyInstaller --noconfirm --clean StockWidget.spec

      - name: Portatif ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\StockWidget\* `
            -DestinationPath "StockWidget-$env:APP_VERSION-portable.zip"

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Kurulum paketi
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe bulunamadı" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız" }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StockWidget ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            StockWidget-${{ env.APP_VERSION }}-portable.zip
            Output/StockWidget-${{ env.APP_VERSION }}-setup.exe
