name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller cyclonedx-bom==9.0.0

      - name: Etiketten sürümü uygula
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "invalid version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          python tools/bump_version.py "$v"

      - name: Testler
        run: |
          python -m py_compile stock_widget.py
          python -m unittest test_stock_widget.py

      - name: Portatif derleme (onedir, ZIP için)
        run: python -m PyInstaller --noconfirm --clean StockWidget.spec

      - name: Tek dosya derleme (onefile, ana indirme)
        run: python -m PyInstaller --noconfirm --clean --distpath dist-onefile StockWidget-onefile.spec

      - name: Tek dosya exe'yi adlandır ve doğrula
        shell: pwsh
        run: |
          Copy-Item dist-onefile\StockWidget.exe "StockWidget-$env:APP_VERSION.exe" -Force
          # Penceresiz exe'nin stdout'u PowerShell `&` ile gelmez; cmd /c kullan.
          $v = (cmd /c "`"$PWD\StockWidget-$env:APP_VERSION.exe`" --version 2>&1").Trim()
          if ($v -ne "StockWidget $env:APP_VERSION") { throw "Sürüm uyuşmuyor: $v" }

      - name: Portatif ZIP
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination dist\StockWidget -Force
          Copy-Item docs -Destination dist\StockWidget -Recurse -Force
          Compress-Archive -Path dist\StockWidget\* `
            -DestinationPath "StockWidget-$env:APP_VERSION-portable.zip"

      - name: GUI duman testi
        shell: pwsh
        run: |
          # Uygulama SW_SMOKE ile 12 sn sonra kendini kapatır.
          $env:SW_DATA_DIR = Join-Path $env:RUNNER_TEMP "sw-smoke"
          $env:SW_SMOKE = "1"
          New-Item -ItemType Directory -Force $env:SW_DATA_DIR | Out-Null
          $p = Start-Process -FilePath "dist\StockWidget\StockWidget.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GUI smoke zaman aşımı" }
          if ($p.ExitCode -ne 0) { throw "GUI smoke hata kodu: $($p.ExitCode)" }

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Kurulum paketi
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe bulunamadı" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız" }

      - name: SHA256 özetleri
        shell: pwsh
        run: |
          $files = @(
            "StockWidget-$env:APP_VERSION.exe",
            "StockWidget-$env:APP_VERSION-portable.zip",
            "Output\StockWidget-$env:APP_VERSION-setup.exe"
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: CycloneDX SBOM
        run: python -m cyclonedx_py requirements requirements.txt --output-format JSON --output-file sbom.json

      - name: Winget ve Scoop manifestleri
        shell: pwsh
        run: |
          $v = $env:APP_VERSION
          $base = "https://github.com/ArifKemal/StockWidget/releases/download/v$v"
          $setupHash = (Get-FileHash "Output\StockWidget-$v-setup.exe" -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash "StockWidget-$v-portable.zip" -Algorithm SHA256).Hash
          python tools/render_manifests.py --version $v `
            --setup-url "$base/StockWidget-$v-setup.exe" --setup-sha256 $setupHash `
            --portable-url "$base/StockWidget-$v-portable.zip" --portable-sha256 $portableHash `
            --output-dir packaging-out
          if ($LASTEXITCODE -ne 0) { throw "Manifest üretimi başarısız" }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StockWidget ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            StockWidget-${{ env.APP_VERSION }}.exe
            StockWidget-${{ env.APP_VERSION }}-portable.zip
            Output/StockWidget-${{ env.APP_VERSION }}-setup.exe
            SHA256SUMS.txt
            sbom.json
            packaging-out/winget/ArifKemal.StockWidget.yaml
            packaging-out/scoop/stockwidget.json
