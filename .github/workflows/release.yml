name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Etiketten sürümü uygula
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($v -notmatch '^\d+(\.\d+){0,3}$') { throw "Geçersiz sürüm etiketi: $env:GITHUB_REF_NAME" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/bump_version.py $v

      - name: Testler
        run: |
          python -m py_compile stock_widget.py
          python -m unittest test_stock_widget.py

      - name: Portatif derleme
        run: python -m PyInstaller --noconfirm --clean StockWidget.spec

      - name: Portatif ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\StockWidget\* `
            -DestinationPath "StockWidget-$env:APP_VERSION-portable.zip"

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Kurulum paketi
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe bulunamadı" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız" }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StockWidget ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            StockWidget-${{ env.APP_VERSION }}-portable.zip
            Output/StockWidget-${{ env.APP_VERSION }}-setup.exe
