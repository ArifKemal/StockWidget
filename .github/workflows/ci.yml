name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Sözdizimi ve testler
        run: |
          python -m py_compile stock_widget.py
          python -m unittest test_stock_widget.py
          python stock_widget.py --version

      - name: Paketleme dumanı (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean StockWidget.spec
          python -m PyInstaller --noconfirm --clean --distpath dist-onefile StockWidget-onefile.spec

      - name: Exe sürüm dumanı
        shell: pwsh
        run: |
          # Penceresiz exe'nin stdout'u PowerShell `&` ile gelmez; cmd /c kullan.
          $expected = (python stock_widget.py --version).Trim()
          foreach ($exe in @("dist-onefile\StockWidget.exe", "dist\StockWidget\StockWidget.exe")) {
            $v = (cmd /c "`"$PWD\$exe`" --version 2>&1").Trim()
            Write-Host "$exe -> $v"
            if ($v -ne $expected) { throw "Sürüm uyuşmuyor: $exe ($v != $expected)" }
          }
