name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tip kontrolü (kademeli)
        if: matrix.python-version == '3.12'
        run: python -m mypy

      - name: Sözdizimi ve testler
        run: |
          python -m py_compile stock_widget.py
          python -m coverage run -m unittest test_stock_widget.py
          python -m coverage run --append tools/ui_matrix.py
          python -m coverage report --include="stock_widget.py" --fail-under=40
          python stock_widget.py --version

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1

      - name: Bağımlılık güvenlik taraması
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Paketleme (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean StockWidget.spec
          python -m PyInstaller --noconfirm --clean --distpath dist-onefile StockWidget-onefile.spec

      - name: Exe sürüm dumanı
        shell: pwsh
        run: |
          # Penceresiz exe'nin stdout'u PowerShell `&` ile gelmez; cmd /c kullan.
          $expected = (python stock_widget.py --version).Trim()
          foreach ($exe in @("dist-onefile\StockWidget.exe", "dist\StockWidget\StockWidget.exe")) {
            $v = (cmd /c "`"$PWD\$exe`" --version 2>&1").Trim()
            Write-Host "$exe -> $v"
            if ($v -ne $expected) { throw "Sürüm uyuşmuyor: $exe ($v != $expected)" }
          }

      - name: GUI duman testi (pencere açılıp kapanıyor mu?)
        shell: pwsh
        run: |
          # SW_SMOKE: uygulama 12 sn sonra kendini kapatır.
          $env:SW_DATA_DIR = Join-Path $env:RUNNER_TEMP "sw-smoke"
          $env:SW_SMOKE = "1"
          New-Item -ItemType Directory -Force $env:SW_DATA_DIR | Out-Null
          $exe = "dist\StockWidget\StockWidget.exe"
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GUI smoke zaman aşımı" }
          if ($p.ExitCode -ne 0) { throw "GUI smoke hata kodu: $($p.ExitCode)" }
          $log = Join-Path $env:SW_DATA_DIR "sw.log"
          if (-not (Test-Path $log)) { throw "log dosyası yok: $log" }
          if (-not (Select-String -Path $log -Pattern "pid" -Quiet)) {
            throw "uygulama başlangıcı loga yazılmadı"
          }
          Write-Host "GUI smoke OK"

      - name: Arayüz matrisi (tema x yoğunluk x DPI)
        run: |
          $env:SW_DATA_DIR = Join-Path $env:RUNNER_TEMP "sw-ui-matrix"
          python tools/ui_matrix.py

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Kurulum paketi derlemesi
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe bulunamadı" }
          # 0.0.1 -> 0.0.2 yükseltme yolunu test etmek için iki paket üret.
          foreach ($v in @("0.0.1", "0.0.2")) {
            & $iscc "/DMyAppVersion=$v" installer.iss
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup derlemesi başarısız: $v"
            }
          }

      - name: Sessiz kurulum, yükseltme ve kaldırma duman testi
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $oldSetup = Join-Path $PWD "Output\StockWidget-0.0.1-setup.exe"
          $newSetup = Join-Path $PWD "Output\StockWidget-0.0.2-setup.exe"
          foreach ($pkg in @($oldSetup, $newSetup)) {
            if (!(Test-Path $pkg)) { throw "Kurulum paketi yok: $pkg" }
          }

          # installer.iss: DefaultDirName={localappdata}\Programs\StockWidget
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\StockWidget"
          $installedExe = Join-Path $installDir "StockWidget.exe"
          # Kurulan exe'nin sürümü, derlenen onedir exe ile aynı olmalı.
          # (Kurulum paketinin sürümü /DMyAppVersion ile ayrıca ezildiği için
          # burada sabit "0.0.0" beklemek yanlıştı.)
          $expected = (cmd /c "`"$PWD\dist\StockWidget\StockWidget.exe`" --version 2>&1").Trim()
          Write-Host "Beklenen sürüm: $expected"
          $logDir = Join-Path $env:RUNNER_TEMP "stockwidget-installer-smoke"
          New-Item -ItemType Directory -Force $logDir | Out-Null
          $oldLog = Join-Path $logDir "install-old.log"
          $upgradeLog = Join-Path $logDir "upgrade.log"
          $uninstallLog = Join-Path $logDir "uninstall.log"
          $silentArgs = @("/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES")

          function Assert-Version([string]$path, [string]$expected) {
            $actual = (cmd /c "`"$path`" --version 2>&1").Trim()
            Write-Host "Kurulan exe -> $actual"
            if ($actual -ne $expected) {
              throw "Sürüm uyuşmuyor: $actual != $expected"
            }
          }

          try {
            # 1) Eski sürümü kur
            $old = Start-Process -FilePath $oldSetup -Wait -PassThru `
              -ArgumentList ($silentArgs + "/LOG=`"$oldLog`"")
            if ($old.ExitCode -ne 0) {
              throw "Eski sürüm kurulum hata kodu: $($old.ExitCode)"
            }
            if (!(Test-Path $installedExe)) { throw "Kurulan exe yok: $installedExe" }
            Assert-Version $installedExe $expected

            # 2) Yeni sürümü üzerine kur (yükseltme yolu)
            $new = Start-Process -FilePath $newSetup -Wait -PassThru `
              -ArgumentList ($silentArgs + "/LOG=`"$upgradeLog`"")
            if ($new.ExitCode -ne 0) {
              throw "Yükseltme hata kodu: $($new.ExitCode)"
            }
            if (!(Test-Path $installedExe)) {
              throw "Yükseltme sonrası exe yok: $installedExe"
            }
            Assert-Version $installedExe $expected
            $uninstallers = @(Get-ChildItem -Path $installDir -Filter "unins*.exe" `
              -File -ErrorAction SilentlyContinue)
            if ($uninstallers.Count -ne 1) {
              throw "Yükseltme sonrası kaldırıcı sayısı: $($uninstallers.Count)"
            }
          }
          finally {
            # Hata yolunda da kurulum/kaldırma adımlarından süreç kalmasın.
            Get-Process -Name StockWidget -ErrorAction SilentlyContinue |
              Stop-Process -Force
            $uninstaller = Get-ChildItem -Path $installDir -Filter "unins*.exe" `
              -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller.FullName -Wait -PassThru `
                -ArgumentList ($silentArgs + "/LOG=`"$uninstallLog`"")
              if ($uninstall.ExitCode -ne 0) {
                throw "Sessiz kaldırma hata kodu: $($uninstall.ExitCode)"
              }
            }
            elseif (Test-Path $installedExe) {
              throw "Kaldırıcı bulunamadı: $installDir"
            }
            Get-Process -Name StockWidget -ErrorAction SilentlyContinue |
              Stop-Process -Force
            if (Test-Path $installedExe) { throw "Sessiz kaldırma exe'yi temizlemedi" }
          }

      - name: Kurulum duman testi logları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inno-smoke-logs
          path: ${{ runner.temp }}/stockwidget-installer-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
